name: Build COCOTAXI 2.6.3 FINAL

on:
  workflow_dispatch:
  push:
    paths:
      - 'COCOTAXI_2.6.1_cruce_logica.zip'
      - 'cocotaxi-2.6.2-final.patch'\n      - 'cocotaxi-2.6.3-ui-goals.patch'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Verify exact 2.6.1 chat ZIP
        shell: bash
        run: |
          test -f COCOTAXI_2.6.1_cruce_logica.zip
          echo "89d5d92edc17a97dbc6f7a06b2bd56e08f6e110602418d3f1e032203d971371c  COCOTAXI_2.6.1_cruce_logica.zip" | sha256sum -c -

      - name: Extract exact source
        shell: bash
        run: |
          rm -rf build-2.6.3
          mkdir build-2.6.3
          unzip -q COCOTAXI_2.6.1_cruce_logica.zip -d build-2.6.3
          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/build-2.6.3" -name gradlew -type f -printf '%h\n' | head -n1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Apply final audited fixes
        shell: bash
        run: |
          patch --batch -p2 -d "$PROJECT_DIR" < cocotaxi-2.6.2-final.patch

      - name: Apply 2.6.3 UI and goal fixes
        shell: bash
        run: |
          patch --batch -p1 -d "$PROJECT_DIR" < cocotaxi-2.6.3-ui-goals.patch

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify final version
        shell: bash
        run: |
          grep -R "versionName '2.6.3'" "$PROJECT_DIR/app/build.gradle"
          grep -R "versionCode 27" "$PROJECT_DIR/app/build.gradle"

      - name: Run complete unit test suite
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Package final auditable source
        shell: bash
        run: |
          cd "$(dirname "$PROJECT_DIR")"
          zip -qr COCOTAXI_2.6.3_fuentes.zip "$(basename "$PROJECT_DIR")"

      - name: Upload COCOTAXI 2.6.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: COCOTAXI-2.6.3-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload COCOTAXI 2.6.2 source
        uses: actions/upload-artifact@v4
        with:
          name: COCOTAXI-2.6.3-source
          path: build-2.6.3/COCOTAXI_2.6.3_fuentes.zip
          if-no-files-found: error
