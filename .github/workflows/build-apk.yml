name: Build COCOTAXI 3.1.8 Core and Data

on:
  workflow_dispatch:
  push:
    paths:
      - 'COCOTAXI_2.6.1_cruce_logica.zip'
      - 'cocotaxi-2.6.2-final.patch'
      - 'cocotaxi-2.6.3-ui-goals.patch'
      - 'cocotaxi-2.6.4-autoaccept-ui.patch'
      - 'cocotaxi-2.6.5-license-manual-ui.patch.gz.b64.part*'
      - 'cocotaxi-2.6.5-license-testfix.patch'
      - 'cocotaxi-2.6.6-meta.patch'
      - 'cocotaxi-2.6.6-store.patch'
      - 'cocotaxi-2.6.6-access.patch'
      - 'cocotaxi-2.6.6-ui.patch'
      - 'cocotaxi-2.6.6-tests.patch'
      - 'cocotaxi-2.6.7-hourly-objective.patch'
      - 'cocotaxi-2.6.8-splash-logo.patch'
      - 'cocotaxi-2.6.9-splash-safearea.patch'
      - 'cocotaxi-2.7.0.patch.gz.b64.part*'
      - 'cocotaxi-2.7.1-screen-promo-zone.patch.gz.b64.part*'
      - 'cocotaxi-3.1-core.patch.gz.b64.part*'
      - 'cocotaxi-3.1-core-hotfix.patch'
      - 'cocotaxi-3.1-core-auditfix.patch'
      - 'cocotaxi-3.1-core-recovery2.patch.gz.b64.part*'
      - 'cocotaxi-3.1.2-process-recovery.patch'
      - 'cocotaxi-3.1.3-manual-parser-auditfix.patch.gz.b64'
      - 'cocotaxi-3.1.3-testfix.patch'
      - 'CAMBIOS_3.1.md'
      - 'cocotaxi-3.1.4-overrides.zip'
      - 'cocotaxi-3.1.5-overlay.patch'
      - 'cocotaxi-3.1.6-corefix.patch'
      - 'cocotaxi-3.1.7-core-data.patch'
      - 'cocotaxi-3.1.8-a52-overlay-autoaccept.patch'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Verify exact 2.6.1 chat ZIP
        shell: bash
        run: |
          test -f COCOTAXI_2.6.1_cruce_logica.zip
          echo "89d5d92edc17a97dbc6f7a06b2bd56e08f6e110602418d3f1e032203d971371c  COCOTAXI_2.6.1_cruce_logica.zip" | sha256sum -c -

      - name: Extract exact source
        shell: bash
        run: |
          rm -rf build-2.6.6
          mkdir build-2.6.6
          unzip -q COCOTAXI_2.6.1_cruce_logica.zip -d build-2.6.6
          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/build-2.6.6" -name gradlew -type f -printf '%h\n' | head -n1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Apply final audited fixes
        shell: bash
        run: |
          patch --batch -p2 -d "$PROJECT_DIR" < cocotaxi-2.6.2-final.patch

      - name: Apply 2.6.3 UI and goal fixes
        shell: bash
        run: |
          patch --batch -p1 -d "$PROJECT_DIR" < cocotaxi-2.6.3-ui-goals.patch

      - name: Apply 2.6.4 autoaccept and button fixes
        shell: bash
        run: |
          patch --batch -p1 -d "$PROJECT_DIR" < cocotaxi-2.6.4-autoaccept-ui.patch

      - name: Rebuild and verify 2.6.5 patch
        shell: bash
        run: |
          cat cocotaxi-2.6.5-license-manual-ui.patch.gz.b64.part{1,2,3,4} > /tmp/coco265.b64
          echo "3c3329f1226e21d00c55869e1e92fe9eb84e8c2a2f4b68a18b4946f0c47d0728  /tmp/coco265.b64" | sha256sum -c -
          base64 -d /tmp/coco265.b64 | gzip -dc > /tmp/coco265.patch
          echo "c3bd47e87873d5f058ae169926093b72b54b94d1cb932b4db6deee6291cdcb81  /tmp/coco265.patch" | sha256sum -c -
          patch --batch -p2 -d "$PROJECT_DIR" < /tmp/coco265.patch
          patch --batch -p1 -d "$PROJECT_DIR" < cocotaxi-2.6.5-license-testfix.patch

      - name: Apply COCOTAXI 2.6.6 objective manual and profile fixes
        shell: bash
        run: |
          patch --batch -p1 -d "$PROJECT_DIR" < cocotaxi-2.6.6-meta.patch
          patch --batch -p1 -d "$PROJECT_DIR" < cocotaxi-2.6.6-store.patch
          patch --batch -p1 -d "$PROJECT_DIR" < cocotaxi-2.6.6-access.patch
          patch --batch -p1 -d "$PROJECT_DIR" < cocotaxi-2.6.6-ui.patch
          patch --batch -p1 -d "$PROJECT_DIR" < cocotaxi-2.6.6-tests.patch

      - name: Apply COCOTAXI 2.6.7 hourly objective display
        shell: bash
        run: |
          patch --batch -p1 -d "$PROJECT_DIR" < cocotaxi-2.6.7-hourly-objective.patch

      - name: Apply COCOTAXI 2.6.8 splash logo change
        shell: bash
        run: |
          patch --batch -p1 -d "$PROJECT_DIR" < cocotaxi-2.6.8-splash-logo.patch

      - name: Apply COCOTAXI 2.6.9 splash safe area fix
        shell: bash
        run: |
          patch --batch -p1 -d "$PROJECT_DIR" < cocotaxi-2.6.9-splash-safearea.patch

      - name: Apply COCOTAXI 2.7.0 requested fixes
        shell: bash
        run: |
          cat cocotaxi-2.7.0.patch.gz.b64.part{1,2} | base64 -d | gzip -dc > /tmp/coco270.patch
          patch --batch -p1 -d "$PROJECT_DIR" < /tmp/coco270.patch

      - name: Apply COCOTAXI 2.7.1 promo map and screen strategy
        shell: bash
        run: |
          cat cocotaxi-2.7.1-screen-promo-zone.patch.gz.b64.part{1,2,3} > /tmp/coco271.b64
          echo "faa267b3d0751cdd4041c8d8e621e1636561510102bd8c717405193892c3104a  /tmp/coco271.b64" | sha256sum -c -
          base64 -d /tmp/coco271.b64 | gzip -dc > /tmp/coco271.patch
          echo "2b5e90755b447e7a78abddcd46ad9f1aa3225bc765692b3f2ea617b0ba562b1e  /tmp/coco271.patch" | sha256sum -c -
          patch --batch -p1 -d "$PROJECT_DIR" < /tmp/coco271.patch

      - name: Apply COCOTAXI 3.1 Core
        shell: bash
        run: |
          cat cocotaxi-3.1-core.patch.gz.b64.part{00,01,02,03,04} > /tmp/coco31.b64
          echo "02553d5f23257f0676ebfb61683037be2b44985800427b88d7ff6d11e69f9632  /tmp/coco31.b64" | sha256sum -c -
          base64 -d /tmp/coco31.b64 | gzip -dc > /tmp/coco31.patch
          echo "994a9698478a4ea10a7d3f6559a88eec4d878a0deb1851151479ec551e481aeb  /tmp/coco31.patch" | sha256sum -c -
          patch --batch -p1 -d "$PROJECT_DIR" < /tmp/coco31.patch

      - name: Apply COCOTAXI 3.1 Core recovery hotfix
        shell: bash
        run: |
          echo "e9fde531055758cb73cd314e544670530402f7a0f959db0551452bc893cc91f7  cocotaxi-3.1-core-hotfix.patch" | sha256sum -c -
          patch --batch -p1 -d "$PROJECT_DIR" < cocotaxi-3.1-core-hotfix.patch

      - name: Apply COCOTAXI 3.1 Core audit fixes
        shell: bash
        run: |
          patch --batch -p1 -d "$PROJECT_DIR" < cocotaxi-3.1-core-auditfix.patch

      - name: Apply COCOTAXI 3.1.1 persistent recovery
        shell: bash
        run: |
          cat cocotaxi-3.1-core-recovery2.patch.gz.b64.part{00,01} > /tmp/coco311.b64
          echo "a4c0856c4654789f9aa632e39e30734a47ea838385c673ab8a1c94fdc7de3358  /tmp/coco311.b64" | sha256sum -c -
          base64 -d /tmp/coco311.b64 | gzip -dc > /tmp/coco311.patch
          echo "1b0bdb6091733349b88049c50aeeef8e6e034281a18b4e5ab0f8bc1e756d43cf  /tmp/coco311.patch" | sha256sum -c -
          patch --batch -p1 -d "$PROJECT_DIR" < /tmp/coco311.patch

      - name: Apply COCOTAXI 3.1.2 process-start recovery
        shell: bash
        run: |
          patch --batch -p1 -d "$PROJECT_DIR" < cocotaxi-3.1.2-process-recovery.patch

      - name: Apply COCOTAXI 3.1.3 manual and parser audit fixes
        shell: bash
        run: |
          echo "2a5f6ada34e099c4d7e5f21577178069718994cbb80dfe4d62007d81ae7d3716  cocotaxi-3.1.3-manual-parser-auditfix.patch.gz.b64" | sha256sum -c -
          base64 -d cocotaxi-3.1.3-manual-parser-auditfix.patch.gz.b64 | gzip -dc > /tmp/coco313.patch
          echo "1bf85084853b60cdd49ddf19e096f46f903ed1ce251ed55e37415c071d1819dc  /tmp/coco313.patch" | sha256sum -c -
          patch --batch -p1 -d "$PROJECT_DIR" < /tmp/coco313.patch

      - name: Apply COCOTAXI 3.1.3 audit test fix
        shell: bash
        run: |
          patch --batch -p1 -d "$PROJECT_DIR" < cocotaxi-3.1.3-testfix.patch

      - name: Finalize audited source tree
        shell: bash
        run: |
          cp CAMBIOS_3.1.md "$PROJECT_DIR/CAMBIOS_3.1.md"
          rm -f "$PROJECT_DIR/app/src/test/java/com/cocotaxi/app/FormulaTest.java.orig"

      - name: Apply COCOTAXI 3.1.4 source and tests
        shell: bash
        run: |
          unzip -oq cocotaxi-3.1.4-overrides.zip -d "$PROJECT_DIR"

      - name: Apply COCOTAXI 3.1.5 rejection overlay
        shell: bash
        run: |
          patch --batch -p1 -d "$PROJECT_DIR" < cocotaxi-3.1.5-overlay.patch

      - name: Apply COCOTAXI 3.1.6 core fixes
        shell: bash
        run: |
          patch --batch -p1 -d "$PROJECT_DIR" < cocotaxi-3.1.6-corefix.patch

      - name: Apply COCOTAXI 3.1.7 Core and Data
        shell: bash
        run: |
          patch --batch -p1 -d "$PROJECT_DIR" < cocotaxi-3.1.8-core-data.patch

      - name: Apply COCOTAXI 3.1.8 A52 fixes
        shell: bash
        run: |
          patch --batch -p1 -d "$PROJECT_DIR" < cocotaxi-3.1.8-a52-overlay-autoaccept.patch

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify final version and public license surface
        shell: bash
        run: |
          grep -R "versionName '3.1.8'" "$PROJECT_DIR/app/build.gradle"
          grep -R "versionCode 58" "$PROJECT_DIR/app/build.gradle"
          grep -R "cocotaxi-license-api.cocotaxi-licenses-alecandido998.workers.dev" "$PROJECT_DIR/app/src/main/java/com/cocotaxi/app/LicenseApiClient.java"
          ! grep -RE "/admin|ADMIN_PANEL_PASSWORD|X-Admin|adminToken" "$PROJECT_DIR/app/src/main/java/com/cocotaxi/app/LicenseApiClient.java"
          ! grep -RE "ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|ACCESS_BACKGROUND_LOCATION" "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -R "flagIncludeNotImportantViews" "$PROJECT_DIR/app/src/main/res/xml/accessibility_config.xml"
          grep -R "recoverFromCabify" "$PROJECT_DIR/app/src/main/java/com/cocotaxi/app/CocoStore.java"
          grep -R "beginRecovery" "$PROJECT_DIR/app/src/main/java/com/cocotaxi/app/CocoStore.java"
          grep -R "recovering INTEGER DEFAULT 0" "$PROJECT_DIR/app/src/main/java/com/cocotaxi/app/CocoStore.java"
          ! grep -R "private boolean assignmentSeen" "$PROJECT_DIR/app/src/main/java/com/cocotaxi/app/CocotaxiAccessibilityService.java"
          grep -R "INTENTO_SIGUIENTE" "$PROJECT_DIR/app/src/main/java/com/cocotaxi/app/CocoStore.java"
          grep -R "trips_require_session" "$PROJECT_DIR/app/src/main/java/com/cocotaxi/app/CocoStore.java"
          grep -R "walletLine" "$PROJECT_DIR/app/src/main/java/com/cocotaxi/app/OfferParser.java"
          ! grep -R "CocoBrain" "$PROJECT_DIR/app/src/main/java/com/cocotaxi/app/CocotaxiAccessibilityService.java"

      - name: Run complete unit test suite
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Report unit test totals
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          files = glob.glob(os.path.join(os.environ["PROJECT_DIR"], "app/build/test-results/testDebugUnitTest/TEST-*.xml"))
          tests = failures = errors = skipped = 0
          for file in files:
              root = ET.parse(file).getroot()
              tests += int(root.attrib.get("tests", 0))
              failures += int(root.attrib.get("failures", 0))
              errors += int(root.attrib.get("errors", 0))
              skipped += int(root.attrib.get("skipped", 0))
          print(f"COCOTAXI_TEST_SUMMARY tests={tests} failures={failures} errors={errors} skipped={skipped}")
          if not files or failures or errors:
              raise SystemExit(1)
          PY

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Package final auditable source
        shell: bash
        run: |
          cd "$(dirname "$PROJECT_DIR")"
          zip -qr COCOTAXI_3.1.8_fuentes.zip "$(basename "$PROJECT_DIR")"

      - name: Upload COCOTAXI 3.1.8 APK
        uses: actions/upload-artifact@v4
        with:
          name: COCOTAXI-3.1.8-core-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload COCOTAXI 3.1.8 source
        uses: actions/upload-artifact@v4
        with:
          name: COCOTAXI-3.1.8-core-source
          path: build-2.6.6/COCOTAXI_3.1.8_fuentes.zip
          if-no-files-found: error
