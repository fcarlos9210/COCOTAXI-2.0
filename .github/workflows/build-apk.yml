name: Build COCOTAXI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'COCOTAXI_2.4.2_sesion_icono_sin_espera_fuentes.zip'
      - 'cocotaxi-2.4.3.patch.gz.b64'
      - 'cocotaxi-2.4.4-app.patch.gz.b64'
      - 'cocotaxi-2.4.5-app.patch.gz.b64.part*'
      - 'cocotaxi-2.4.6-ui-pin.patch.gz.b64'
      - 'prepare_project.sh'
      - '.github/workflows/build-apk.yml'

# Reconstruct the verified source chain, test it and compile COCOTAXI 2.4.6.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare exact 2.4.6 project
        run: |
          chmod +x prepare_project.sh
          ./prepare_project.sh
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/COCOTAXI_2.4.6" >> "$GITHUB_ENV"
          grep -n "versionName '2.4.6'" COCOTAXI_2.4.6/app/build.gradle
          grep -n "versionCode 21" COCOTAXI_2.4.6/app/build.gradle

      - name: Regression and PIN tests
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest \
            --tests com.cocotaxi.app.FormulaTest \
            --tests com.cocotaxi.app.PromotionStoreTest \
            --tests com.cocotaxi.app.CardAccessibilityTest \
            --tests com.cocotaxi.app.OverlayTest \
            --tests com.cocotaxi.app.PinStoreTest \
            --tests com.cocotaxi.app.StoreTest.photographedOriginConfirmsAssignmentOnlyOnce \
            --tests com.cocotaxi.app.StoreTest.confirmedAcceptanceStartsLiveServiceAndIncomeImmediately \
            --tests com.cocotaxi.app.StoreTest.driverCanRemoveAndRestoreDefaultTripConfirmation \
            --tests com.cocotaxi.app.StoreTest.finishButtonNotCompletion \
            --tests com.cocotaxi.app.StoreTest.completedExactlyOnce \
            --tests com.cocotaxi.app.UiTest.iconMinimizesOnlyResumedCoco \
            --tests com.cocotaxi.app.UiTest.fourTabsAndScreensRender

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Package auditable source
        run: |
          zip -qr COCOTAXI_2.4.6_fuentes.zip COCOTAXI_2.4.6

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: COCOTAXI-2.4.6-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: COCOTAXI-2.4.6-source
          path: COCOTAXI_2.4.6_fuentes.zip
          if-no-files-found: error
