name: Build COCOTAXI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'COCOTAXI_2.4.2_sesion_icono_sin_espera_fuentes.zip'
      - '.github/workflows/build-apk.yml'

# Build from the ZIP stored in the repository.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip project
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q COCOTAXI_2.4.2_sesion_icono_sin_espera_fuentes.zip -d build-src
          echo "PROJECT_DIR=$(find build-src -name gradlew -type f -printf '%h\n' | head -n1)" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: COCOTAXI-2.4.2-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
