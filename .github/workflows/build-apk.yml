name: Build COCOTAXI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'COCOTAXI_2.4.2_sesion_icono_sin_espera_fuentes.zip'
      - 'cocotaxi-2.4.3.patch.gz.b64'
      - 'cocotaxi-2.4.4-app.patch.gz.b64'
      - 'cocotaxi-2.4.5-app.patch.gz.b64.part*'
      - '.github/workflows/build-apk.yml'

# Rebuild the verified source chain and compile COCOTAXI 2.4.5.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip project
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q COCOTAXI_2.4.2_sesion_icono_sin_espera_fuentes.zip -d build-src
          echo "PROJECT_DIR=$(find build-src -name gradlew -type f -printf '%h\n' | head -n1)" >> "$GITHUB_ENV"

      - name: Apply 2.4.3 base fixes
        run: |
          base64 -d cocotaxi-2.4.3.patch.gz.b64 | gzip -dc > build-src/2.4.3.patch
          patch --batch --forward -p1 -d "$PROJECT_DIR" < build-src/2.4.3.patch

      - name: Apply 2.4.4 speed fixes
        run: |
          base64 -d cocotaxi-2.4.4-app.patch.gz.b64 | gzip -dc > build-src/2.4.4.patch
          patch --batch --forward -p1 -d "$PROJECT_DIR" < build-src/2.4.4.patch

      - name: Apply 2.4.5 session and UI fixes
        run: |
          cat cocotaxi-2.4.5-app.patch.gz.b64.part1 cocotaxi-2.4.5-app.patch.gz.b64.part2 cocotaxi-2.4.5-app.patch.gz.b64.part3 cocotaxi-2.4.5-app.patch.gz.b64.part4 | base64 -d | gzip -dc > build-src/2.4.5-app.patch
          patch --batch --forward -p1 -d "$PROJECT_DIR" < build-src/2.4.5-app.patch
          grep -n "versionName '2.4.5'" "$PROJECT_DIR/app/build.gradle"

      - name: Unit tests
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest \
            --tests com.cocotaxi.app.StoreTest.photographedOriginConfirmsAssignmentOnlyOnce \
            --tests com.cocotaxi.app.StoreTest.confirmedAcceptanceStartsLiveServiceAndIncomeImmediately \
            --tests com.cocotaxi.app.StoreTest.driverCanRemoveAndRestoreDefaultTripConfirmation \
            --tests com.cocotaxi.app.StoreTest.finishButtonNotCompletion \
            --tests com.cocotaxi.app.StoreTest.completedExactlyOnce \
            --tests com.cocotaxi.app.UiTest.iconMinimizesOnlyResumedCoco \
            --tests com.cocotaxi.app.UiTest.fourTabsAndScreensRender

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: COCOTAXI-2.4.5-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
