name: Build COCOTAXI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'COCOTAXI_2.4.2_sesion_icono_sin_espera_fuentes.zip'
      - 'cocotaxi-2.4.3.patch.gz.b64'
      - 'cocotaxi-2.4.4-app.patch.gz.b64'
      - '.github/workflows/build-apk.yml'

# Build 2.4.4 from the verified 2.4.2 source, the 2.4.3 patch, and the focused 2.4.4 app patch.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip project
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q COCOTAXI_2.4.2_sesion_icono_sin_espera_fuentes.zip -d build-src
          echo "PROJECT_DIR=$(find build-src -name gradlew -type f -printf '%h\n' | head -n1)" >> "$GITHUB_ENV"

      - name: Apply COCOTAXI 2.4.3 base fixes
        run: |
          base64 -d cocotaxi-2.4.3.patch.gz.b64 | gzip -dc > build-src/cocotaxi-2.4.3.patch
          patch --batch --forward -p1 -d "$PROJECT_DIR" < build-src/cocotaxi-2.4.3.patch

      - name: Apply COCOTAXI 2.4.4 speed and acceptance fixes
        run: |
          base64 -d cocotaxi-2.4.4-app.patch.gz.b64 | gzip -dc > build-src/cocotaxi-2.4.4-app.patch
          patch --batch --forward -p1 -d "$PROJECT_DIR" < build-src/cocotaxi-2.4.4-app.patch
          grep -n "versionName '2.4.4'" "$PROJECT_DIR/app/build.gradle"

      - name: Run unit tests
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: COCOTAXI-2.4.4-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
