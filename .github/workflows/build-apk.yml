name: Build COCOTAXI 2.6.1 EXACT

on:
  workflow_dispatch:
  push:
    paths:
      - 'COCOTAXI_2.6.1_cruce_logica.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact 2.6.1 branch
        uses: actions/checkout@v4

      - name: Verify exact chat ZIP
        shell: bash
        run: |
          test -f COCOTAXI_2.6.1_cruce_logica.zip
          echo "89d5d92edc17a97dbc6f7a06b2bd56e08f6e110602418d3f1e032203d971371c  COCOTAXI_2.6.1_cruce_logica.zip" | sha256sum -c -

      - name: Extract exact 2.6.1 source
        shell: bash
        run: |
          rm -rf build-2.6.1
          mkdir build-2.6.1
          unzip -q COCOTAXI_2.6.1_cruce_logica.zip -d build-2.6.1
          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/build-2.6.1" -name gradlew -type f -printf '%h\n' | head -n1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Compilando directamente: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify 2.6.1 version
        shell: bash
        run: |
          grep -R "versionName '2.6.1'" "$PROJECT_DIR/app/build.gradle"
          grep -R "versionCode 25" "$PROJECT_DIR/app/build.gradle"

      - name: Run tests (audit, non-blocking)
        continue-on-error: true
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Upload COCOTAXI 2.6.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: COCOTAXI-2.6.1-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
