name: Build COCOTAXI 2.8.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - build-cocotaxi-2.8.0
    paths:
      - 'build_2.8.0/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Reconstruct COCOTAXI 2.8.0 source
        shell: bash
        run: |
          set -euo pipefail
          unzip -q COCOTAXI_2.6.1_cruce_logica.zip

          cat build_2.8.0/main_overlay.part{01..10}.b64 | tr -d '\n\r' | base64 -d > /tmp/overlay_truncated.zip
          base64 -d build_2.8.0/overlay_local_tail.b64 >> /tmp/overlay_truncated.zip
          echo "da909d39d21c638076f5198340849460bd737975703dc65a7783924d60cb040f  /tmp/overlay_truncated.zip" | sha256sum -c -

          python3 - <<'PY'
          from pathlib import Path
          import shutil, struct, zlib

          data = Path('/tmp/overlay_truncated.zip').read_bytes()
          out = Path('COCOTAXI_2.6.1_cruce_logica')
          i = 0
          count = 0

          while i + 30 <= len(data):
              sig = struct.unpack_from('<I', data, i)[0]
              if sig != 0x04034B50:
                  raise SystemExit(f'Unexpected ZIP signature {sig:#x} at offset {i}')

              ver, flag, method, mt, md, crc, csize, usize, fnlen, exlen = struct.unpack_from('<HHHHHIIIHH', data, i + 4)
              if flag & 8:
                  raise SystemExit(f'Unsupported ZIP data descriptor at offset {i}')

              name = data[i + 30:i + 30 + fnlen].decode('utf-8')
              start = i + 30 + fnlen + exlen
              compressed = data[start:start + csize]

              if method == 0:
                  raw = compressed
              elif method == 8:
                  raw = zlib.decompress(compressed, -15)
              else:
                  raise SystemExit(f'Unsupported compression method {method} for {name}')

              if len(raw) != usize:
                  raise SystemExit(f'Size mismatch for {name}: {len(raw)} != {usize}')

              dest = out / name
              if name.endswith('/'):
                  dest.mkdir(parents=True, exist_ok=True)
              else:
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(raw)

              count += 1
              i = start + csize

          if i != len(data):
              raise SystemExit(f'Overlay parse stopped at {i} of {len(data)} bytes')
          if count != 43:
              raise SystemExit(f'Expected 43 overlay files, extracted {count}')

          print(f'Applied {count} verified COCOTAXI 2.8.0 overlay files')
          PY

          cat > COCOTAXI_2.6.1_cruce_logica/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.10.1' apply false }
          EOF

          cat > COCOTAXI_2.6.1_cruce_logica/gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat > COCOTAXI_2.6.1_cruce_logica/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  if (System.getenv('COCO_LOCAL_MAVEN')) maven { url = uri(System.getenv('COCO_LOCAL_MAVEN')) }
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  if (System.getenv('COCO_LOCAL_MAVEN')) maven { url = uri(System.getenv('COCO_LOCAL_MAVEN')) }
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'COCOTAXI'
          include ':app'
          EOF

          grep -n "versionName '2.8.0'" COCOTAXI_2.6.1_cruce_logica/app/build.gradle
          grep -n "versionCode 36" COCOTAXI_2.6.1_cruce_logica/app/build.gradle
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/COCOTAXI_2.6.1_cruce_logica" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          cp "$PROJECT_DIR"/app/build/outputs/apk/debug/*.apk COCOTAXI_2.8.0_debug.apk
          sha256sum COCOTAXI_2.8.0_debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: COCOTAXI-2.8.0-debug-apk
          path: COCOTAXI_2.8.0_debug.apk
          if-no-files-found: error
