plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cocotaxi.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.cocotaxi.app'
        minSdk 26
        targetSdk 36
        versionCode 58
        versionName '3.1.8'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions { unitTests.includeAndroidResources = true }
    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}


dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}

// Robolectric downloads its instrumented Android runtime from Maven Central.
tasks.withType(Test).configureEach {
    systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
    ['http.proxyHost','http.proxyPort','http.proxyUser','http.proxyPassword',
     'https.proxyHost','https.proxyPort','https.proxyUser','https.proxyPassword'].each { key ->
        if (System.getProperty(key) != null) systemProperty key, System.getProperty(key)
    }
}
